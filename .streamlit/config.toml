# ACM SPEC design system — navy accent, warm near-white surface.
# primaryColor drives focus rings, slider, spinner: keep it the accent navy,
# never red (Streamlit default) and never as a background fill.
[theme]
primaryColor = "#1F3A5F"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C2C2A"

# Real budget forms are small spreadsheets; 25MB is generous headroom while
# ruling out multi-hundred-MB uploads.
# fileWatcherType="none" turns off Streamlit's dev-mode file watcher (and the
# "Source file changed" banner it triggers) — this is a production deployment,
# not a live-editing dev session.
[server]
maxUploadSize = 25
fileWatcherType = "none"
